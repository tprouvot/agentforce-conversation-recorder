name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium
      - run: npm run typecheck
      - name: Tests, fixtures included (offline, no org needed)
        run: npm test
        env:
          AFREC_REQUIRE_BROWSER: '1'
      - name: Selector packs are valid
        run: |
          node bin/afrec.js selectors check packs/lightning.json
          node bin/afrec.js selectors check packs/messaging.json
      - name: The examples plan
        run: node bin/afrec.js run examples/ebike --dry-run --org myAdminAlias
